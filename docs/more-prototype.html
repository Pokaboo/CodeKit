<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeKit · 更多规划中（原型 v3）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#2563eb; --accent:#8b5cf6; --soft:#eff6ff;
    --bg:#f8fafc; --t1:#0f172a; --t2:#475569; --t3:#94a3b8;
    --sans:"Outfit","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .appbar{display:flex;align-items:center;gap:14px;height:48px;padding:0 20px;background:#fff;border-bottom:1px solid #f0f0f0}
  .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  .logo .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .crumb{font-size:13px;color:var(--t2)} .crumb b{color:var(--primary)}

  .stage{position:relative;min-height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%,#eef2ff 0%,#f8fafc 55%)}

  /* center package */
  .pkg-wrap{position:relative;z-index:2;text-align:center}
  .pkg{font-size:104px;line-height:1;display:inline-block;animation:bounce 1.8s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(37,99,235,.18))}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}40%{transform:translateY(-30px) rotate(3deg)}60%{transform:translateY(-12px) rotate(0)}}
  .shadow{width:96px;height:16px;background:#cbd5e1;border-radius:50%;margin:6px auto 0;animation:sh 1.8s ease-in-out infinite}
  @keyframes sh{0%,100%{transform:scaleX(1);opacity:.3}40%{transform:scaleX(.55);opacity:.14}60%{transform:scaleX(.82);opacity:.22}}

  h1{font-size:38px;font-weight:700;letter-spacing:-.5px;margin-top:18px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:15px;color:var(--t2);margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--soft);color:var(--primary);
    padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600}
  .pip{width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.22);animation:blink 1.3s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* progress */
  .bar{width:260px;height:8px;background:#e2e8f0;border-radius:999px;margin:22px auto 0;overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0;width:99%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .pct{font-family:var(--mono);font-size:12px;color:var(--t3);margin-top:8px}

  /* mini roadmap */
  .road{display:flex;gap:10px;margin-top:30px;z-index:2}
  .chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;animation:bob 2.4s ease-in-out infinite}
  .chip:nth-child(2){animation-delay:.3s} .chip:nth-child(3){animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo"><span class="dot">⚡</span> CodeKit</div>
  <div class="crumb">更多 / <b>规划中</b></div>
</div>

<div class="stage">
  <div class="pkg-wrap">
    <div class="pkg">📦</div>
    <div class="shadow"></div>
    <h1>更多神器，在路上</h1>
    <div class="sub">程序员正以蜗牛时速狂奔 🐌</div>
    <div class="pill"><span class="pip"></span> 在写了</div>

    <div class="bar"><i></i></div>
    <div class="pct">加载中… 99%</div>

    <div class="road">
      <div class="chip">✅ 已上线</div>
      <div class="chip">🚧 进行中</div>
      <div class="chip">💭 规划中</div>
    </div>
  </div>
</div>

</body>
</html>
